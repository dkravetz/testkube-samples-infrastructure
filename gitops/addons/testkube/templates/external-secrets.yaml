# modules/eks-cluster (testkube.tf) writes these to Secrets Manager under platform/testkube/<name>.
{{- range $name := list "postgres" "storage" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: testkube-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws
  target:
    name: testkube-{{ $name }}
  dataFrom:
    - extract:
        key: platform/testkube/{{ $name }}
{{- end }}
