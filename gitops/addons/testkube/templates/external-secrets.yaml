# modules/eks-cluster (testkube.tf) writes these to Secrets Manager under platform/testkube/<name>.
{{- range $name := list "postgres" "storage" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: testkube-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Before the workloads that read it: on a fresh cluster ESO's webhook may not be up yet, and a
    # failed apply in an earlier wave fails the sync (so Argo CD retries) instead of leaving it
    # waiting for a Deployment that can't start.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws
  target:
    name: testkube-{{ $name }}
  dataFrom:
    - extract:
        key: platform/testkube/{{ $name }}
{{- end }}
