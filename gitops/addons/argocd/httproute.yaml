# http://argocd.platform.localhost → argocd-server (plain HTTP: server.insecure, BRIEF D21).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
  hostnames:
    - argocd.platform.localhost
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
