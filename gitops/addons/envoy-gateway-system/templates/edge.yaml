# Envoy's Service is called "edge" and is a NodePort on 30080/30443: the socat container on the
# laptop forwards :80/:443 there. ministack's k3s has no LoadBalancer support.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: edge
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: edge
        type: NodePort
        # Ports merge by number. Each has Envoy Gateway's own name for it, so the Service stays
        # valid before the https listener exists (its certificate arrives through External
        # Secrets): an unnamed second port would be rejected, and with it plain HTTP.
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  nodePort: 30080
                - name: https-443
                  port: 443
                  nodePort: 30443
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: edge
    namespace: {{ .Release.Namespace }}
---
# Both listeners serve every route: HTTP doesn't redirect to HTTPS, because pods call the same
# hostnames over plain HTTP and don't trust the local CA.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: edge-tls
      allowedRoutes:
        namespaces:
          from: All
