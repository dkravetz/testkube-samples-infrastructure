# The Gateway's certificate, made by modules/eks-cluster (tls.tf) and stored in Secrets Manager
# with the keys of a kubernetes.io/tls Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: edge-tls
  namespace: {{ .Release.Namespace }}
  annotations:
    # Before the workloads that read it: on a fresh cluster ESO's webhook may not be up yet, and a
    # failed apply in an earlier wave fails the sync (so Argo CD retries) instead of leaving it
    # waiting for a Deployment that can't start.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws
  target:
    name: edge-tls
    template:
      type: kubernetes.io/tls
  dataFrom:
    - extract:
        key: platform/tls/edge
