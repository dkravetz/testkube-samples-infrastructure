# Every namespace reads ministack's Secrets Manager through this store, as ESO's IAM
# role: ESO exchanges its service account's token for the role named in the account's annotation.
# Wave 1: after the chart's CRDs and its webhook (wave 0) are up.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: {{ .Release.Namespace }}
