# Each Secret's keys are environment variables of a Terrakube component; modules/eks-cluster
# (terrakube.tf) writes them to Secrets Manager under platform/terrakube/<component>.
{{- range $component, $secret := dict
      "api" "terrakube-api-secrets"
      "executor" "terrakube-executor-secrets"
      "registry" "terrakube-registry-secrets"
      "dex" "terrakube-dex-env" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Before the workloads that read it: on a fresh cluster ESO's webhook may not be up yet, and a
    # failed apply in an earlier wave fails the sync (so Argo CD retries) instead of leaving it
    # waiting for a Deployment that can't start.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws
  target:
    name: {{ $secret }}
  dataFrom:
    - extract:
        key: platform/terrakube/{{ $component }}
{{- end }}
