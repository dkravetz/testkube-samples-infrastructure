# The whole platform from nothing: ministack on the laptop, the S3 bucket and IAM role OpenTofu
# uses, then every stack under stacks/ in order (each also a plain `tofu init` / `tofu apply`).
version: '3'
silent: true

includes:
  ministack: ./bootstrap/ministack

vars:
  # Written by stacks/eks; its common name is "<cluster> local CA".
  CA_FILE: .local/ca.crt
  CA_NAME: testkube-poc local CA
  KEYCHAIN: ~/Library/Keychains/login.keychain-db

tasks:
  bootstrap:
    desc: Start ministack and socat, create the OpenTofu state bucket and the tofu role, apply every stack and add the cluster to ~/.kube/config
    cmds:
      - task: ministack:up
      - tofu -chdir=bootstrap/tofu-state init -input=false
      - tofu -chdir=bootstrap/tofu-state apply -input=false -auto-approve
      - task: github-app-key
      # vpc → eks (cluster, Argo CD, everything cluster-core) → terrakube (its config; waits for
      # the Terrakube API Argo CD installs).
      - for: [vpc, eks, terrakube]
        cmd: tofu -chdir=stacks/{{.ITEM}} init -input=false && tofu -chdir=stacks/{{.ITEM}} apply -input=false -auto-approve
      - task: kubeconfig
      - task: urls

  github-app-key:
    desc: Write the GitHub App's private key as PKCS#8 (.local/github-app.pkcs8.pem), for Terrakube
    preconditions:
      - sh: test -f .local/github-app.pem
        msg: ".local/github-app.pem is missing: download the GitHub App's private key there."
    cmds:
      # GitHub hands out PKCS#1 keys; Terrakube only reads PKCS#8.
      - openssl pkcs8 -topk8 -nocrypt -in .local/github-app.pem -out .local/github-app.pkcs8.pem

  kubeconfig:
    desc: Add the testkube-poc cluster to ~/.kube/config (task bootstrap runs it after stacks/eks)
    deps: [ministack:aws-profile]
    cmds:
      - aws --profile ministack eks update-kubeconfig --name testkube-poc --alias testkube-poc --user-alias testkube-poc
      # With AUTH, ministack only accepts tokens signed for sts.<region>.amazonaws.com, but the
      # profile's endpoint_url would sign them for localhost. get-token only signs locally, so
      # nothing is sent to AWS.
      - kubectl config set-credentials testkube-poc --exec-env=AWS_ENDPOINT_URL_STS=https://sts.us-east-1.amazonaws.com >/dev/null

  down:
    desc: Remove ministack and everything in it, including every stack's state
    cmds:
      - task: ministack:down
      - rm -f bootstrap/tofu-state/terraform.tfstate bootstrap/tofu-state/terraform.tfstate.backup
      # Written by task kubeconfig.
      - rm -f ~/.kube/config
      # The next stacks/eks apply makes a new CA.
      - task: untrust-ca
      - rm -f {{.CA_FILE}}
      # Made from .local/github-app.pem by task github-app-key; the .pem itself stays.
      - rm -f .local/github-app.pkcs8.pem

  urls:
    desc: Show the endpoints and logins
    cmds:
      - |
        echo "ministack:  http://localhost:4566"
        if password=$(tofu -chdir=stacks/eks output -raw argocd_admin_password 2>/dev/null); then
          echo "Argo CD:    http://argocd.platform.localhost  https://argocd.platform.localhost  (admin / $password)"
        else
          echo "Argo CD:    not deployed (tofu apply in stacks/eks)"
        fi
        if password=$(tofu -chdir=stacks/eks output -raw terrakube_admin_password 2>/dev/null); then
          echo "Terrakube:  http://terrakube.platform.localhost  ($(tofu -chdir=stacks/eks output -raw terrakube_admin_email) / $password)"
          echo "            API http://terrakube-api.platform.localhost  (token $(tofu -chdir=stacks/eks output -raw terrakube_admin_token))"
        fi
        # Every app env the cluster serves: the first (browser) hostname of each HTTPRoute that
        # isn't the platform's own (*.platform.localhost, above).
        hosts=$(kubectl get httproutes -A -o jsonpath='{range .items[*]}{.spec.hostnames[0]}{"\n"}{end}' 2>/dev/null \
          | grep -v '\.platform\.localhost$' | sort -u)
        for host in $hosts; do
          echo "App:        http://$host  https://$host"
        done
        if [ -f {{.CA_FILE}} ]; then
          echo "Local CA:   {{.CA_FILE}}  (curl --cacert {{.CA_FILE}}; task trust-ca for browsers)"
        else
          echo "Local CA:   not created (tofu apply in stacks/eks)"
        fi

  trust-ca:
    desc: Trust the local CA ({{.CA_FILE}}) in the macOS login keychain, for HTTPS in browsers
    prompt: Add {{.CA_FILE}} to your login keychain as a trusted root? macOS asks for your password.
    preconditions:
      - sh: test -f {{.CA_FILE}}
        msg: "{{.CA_FILE}} is missing: tofu apply in stacks/eks first."
    cmds:
      # Any older CA of a previous cluster first.
      - task: untrust-ca
      - security add-trusted-cert -r trustRoot -k {{.KEYCHAIN}} {{.CA_FILE}}

  untrust-ca:
    desc: Remove every "{{.CA_NAME}}" certificate and its trust from the macOS login keychain
    cmds:
      - |
        for hash in $(security find-certificate -a -Z -c '{{.CA_NAME}}' {{.KEYCHAIN}} 2>/dev/null | awk '/^SHA-256 hash:/ {print $3}'); do
          security delete-certificate -t -Z "$hash" {{.KEYCHAIN}}
        done
